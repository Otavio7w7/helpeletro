name: Header flutuante persistente

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Aplicar header fixo e acessível em toda a página
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = base64.b64decode('').decode()
          js = base64.b64decode('').decode()
          if 'HEADER_FLUTUANTE_PERSISTENTE' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)
          if 'HEADER_FLUTUANTE_JS' not in s:
              idx = s.rfind('</script>')
              if idx == -1:
                  raise SystemExit('Tag script de fechamento não encontrada')
              s = s[:idx] + js + '\n' + s[idx:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remover rotina temporária
        shell: bash
        run: rm -f .github/workflows/header-fixo.yml

      - name: Publicar alteração
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/header-fixo.yml
          if git diff --cached --quiet; then
            echo "Nada para atualizar."
            exit 0
          fi
          git commit -m "Adiciona header flutuante persistente [skip ci]"
          git push
