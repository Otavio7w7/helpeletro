name: Ajustar seção Sobre

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ajustar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mover selo da imagem para evitar sobreposição
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          old = '.badge{position:absolute;left:24px;bottom:24px;background:rgba(7,17,31,.88);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);color:#fff;padding:17px 20px;border-radius:16px;font-weight:800}'
          new = '.badge{position:absolute;left:24px;top:24px;bottom:auto;max-width:calc(100% - 48px);background:rgba(7,17,31,.88);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);color:#fff;padding:14px 18px;border-radius:16px;font-weight:800}'
          if old not in html:
              raise SystemExit('Regra .badge esperada não encontrada')
          html = html.replace(old, new, 1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Publicar ajuste e remover rotina temporária
        shell: bash
        run: |
          rm -f .github/workflows/ajustar-sobre.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Evita sobreposição de texto na imagem Sobre [skip ci]"
          git push
