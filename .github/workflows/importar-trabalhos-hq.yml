name: Importar trabalhos HQ

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  importar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Importar imagens HQ e revisar mobile
        run: python .github/scripts/import_hq.py

      - name: Publicar alterações e limpar temporários
        shell: bash
        run: |
          rm -f .github/workflows/importar-trabalhos-hq.yml
          rm -f .github/scripts/import_hq.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adiciona trabalhos em HQ e revisa responsividade [skip ci]"
          git push
