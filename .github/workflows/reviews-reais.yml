name: Adicionar avaliações reais do Google

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  atualizar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inserir avaliações reais na seção do Google
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          alvo = '<div class="reviews-grid" id="googleReviewsGrid"></div>'
          novo = '''<div class="reviews-grid" id="googleReviewsGrid">
            <article class="review-card reveal">
              <div class="review-head"><div class="review-avatar" aria-hidden="true">R</div><div><span class="review-author">Rafael Coelho</span><span class="review-time">3 meses atrás · Google</span></div></div>
              <div class="review-rating" aria-label="5 estrelas">★★★★★</div>
              <p class="review-text">“Compromissados e éticos, fizeram os trabalhos tanto em minha casa quanto em meu comércio. Recomendo demais”</p>
            </article>
            <article class="review-card reveal">
              <div class="review-head"><div class="review-avatar" aria-hidden="true">M</div><div><span class="review-author">Marcia Fernandes</span><span class="review-time">6 meses atrás · Google</span></div></div>
              <div class="review-rating" aria-label="5 estrelas">★★★★★</div>
              <p class="review-text">“Excelente trabalho! Pontual e preço justo.”</p>
            </article>
            <article class="review-card reveal">
              <div class="review-head"><div class="review-avatar" aria-hidden="true">L</div><div><span class="review-author">Leda Coltro</span><span class="review-time">6 meses atrás · Google</span></div></div>
              <div class="review-rating" aria-label="5 estrelas">★★★★★</div>
              <p class="review-text">“Técnicos atenciosos, trabalho bem realizado e rapidez no atendimento. Recomendo”</p>
            </article>
          </div>'''

          if alvo in s:
              s = s.replace(alvo, novo, 1)
          elif 'Rafael Coelho' not in s:
              raise SystemExit('Bloco de avaliações não encontrado no formato esperado.')

          # Avatar com inicial simples e elegante para reviews inseridos manualmente.
          css_marker = '.review-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#e8eef4}'
          css_new = '.review-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#e8eef4;display:grid;place-items:center;font-weight:800;color:#0f6fbd}'
          if css_marker in s:
              s = s.replace(css_marker, css_new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Publicar e limpar rotina temporária
        shell: bash
        run: |
          rm -f .github/workflows/reviews-reais.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adiciona avaliações reais do Google à seção de depoimentos [skip ci]"
          git push
