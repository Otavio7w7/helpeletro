name: Mensagem WhatsApp para região

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  atualizar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar botão de disponibilidade
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import quote

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          mensagem = 'Olá! Vi no site da Help Eletro e gostaria de verificar a disponibilidade para atendimento.\n\nCidade:\nBairro/Endereço:\nServiço desejado:'
          novo = 'https://wa.me/5519997287304?text=' + quote(mensagem, safe='')
          antigo = 'href="https://wa.me/5519997287304" target="_blank">Verificar disponibilidade →</a>'
          substituto = f'href="{novo}" target="_blank">Verificar disponibilidade →</a>'

          if antigo not in s:
              raise SystemExit('Botão Verificar disponibilidade não encontrado no formato esperado.')

          s = s.replace(antigo, substituto, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Publicar e limpar rotinas temporárias
        shell: bash
        run: |
          rm -f .github/workflows/whatsapp-regiao.yml
          rm -f .github/workflows/migrar-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adiciona mensagem pronta no botão de disponibilidade [skip ci]"
          git push
