name: Otimizar imagens WebP

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/otimizar-imagens.yml'

permissions:
  contents: write

jobs:
  otimizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: python -m pip install --upgrade pillow

      - name: Converter imagens para WebP
        run: python .github/scripts/otimizar_imagens.py

      - name: Publicar otimização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Otimiza imagens do site com WebP [skip ci]"
          git push
