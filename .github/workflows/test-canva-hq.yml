name: Teste fonte HQ
on:
  push:
    branches: [main]
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar posts públicos da Help Eletro
        shell: bash
        run: |
          set +e
          python3 -m pip install --quiet instaloader
          mkdir -p /tmp/ig
          instaloader --dirname-pattern=/tmp/ig --no-videos --no-captions --no-metadata-json --no-compress-json --post-metadata-txt='' --fast-update help_eletro25
          rc=$?
          echo "instaloader_rc=$rc"
          find /tmp/ig -maxdepth 2 -type f -printf '%f %s bytes\n' | head -80
          echo "total=$(find /tmp/ig -type f | wc -l)"
          exit 0
