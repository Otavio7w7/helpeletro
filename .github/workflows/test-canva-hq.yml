name: Test Canva HQ
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test original URL
        shell: bash
        run: |
          set -euxo pipefail
          url='https://media.canva.com/v2/files/uri:ifs%3A%2F%2FM%2Fe24095dd-d873-4aab-9546-861ace2f282b'
          curl -L --fail --retry 2 "$url" -o /tmp/mesa.jpg
          file /tmp/mesa.jpg
          wc -c /tmp/mesa.jpg
          python - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/mesa.jpg')
          print('DIMENSIONS', im.size, im.format)
          PY
