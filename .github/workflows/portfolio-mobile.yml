name: Portfólio e revisão mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Atualizar portfólio e responsividade
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Textos da seção de trabalhos
          s = s.replace('Uma seleção enxuta de trabalhos reais.', 'Trabalhos reais em diferentes tipos de instalação.')
          s = s.replace('Projetos selecionados para mostrar variedade sem repetir imagens. Clique para ampliar.', 'Uma amostra de serviços executados pela Help Eletro. Clique em qualquer imagem para ampliar.')
          s = s.replace('Galeria reduzida para preservar variedade visual e qualidade.', 'Registros reais de serviços realizados pela Help Eletro.')

          # Novos trabalhos — inserção idempotente antes do fechamento da galeria
          marker = 'assets/trabalho-tomada-mesa.jpg'
          anchor = '</div><p class="gallery-note">Registros reais de serviços realizados pela Help Eletro.</p>'
          if marker not in s:
              cards = '''<button class="work reveal" data-img="assets/trabalho-tomada-mesa.jpg" data-caption="Instalação de tomada em mesa de escritório"><img src="assets/trabalho-tomada-mesa.jpg" alt="Instalação de tomada em mesa de escritório" loading="lazy"><span class="work-label">Tomada em mesa de escritório <span>Praticidade e organização no ambiente de trabalho</span></span></button><button class="work reveal" data-img="assets/trabalho-tomadas-sala.jpg" data-caption="Instalação de tomadas em sala"><img src="assets/trabalho-tomadas-sala.jpg" alt="Instalação de tomadas em sala" loading="lazy"><span class="work-label">Tomadas em sala <span>Instalação organizada e segura</span></span></button><button class="work reveal work-tall" data-img="assets/trabalho-refletor.jpg" data-caption="Teste e instalação de refletor"><img src="assets/trabalho-refletor.jpg" alt="Teste e instalação de refletor" loading="lazy"><span class="work-label">Iluminação externa <span>Teste de refletor em serviço de campo</span></span></button><button class="work reveal work-tall" data-img="assets/trabalho-nossos-trabalhos.jpg" data-caption="Serviços elétricos realizados pela Help Eletro"><img src="assets/trabalho-nossos-trabalhos.jpg" alt="Montagem com trabalhos realizados pela Help Eletro" loading="lazy"><span class="work-label">Atuação em campo <span>Instalações, iluminação e sistemas de segurança</span></span></button><button class="work reveal" data-img="assets/trabalho-antes-depois-tomadas.jpg" data-caption="Troca e regularização de tomadas"><img src="assets/trabalho-antes-depois-tomadas.jpg" alt="Antes e depois da troca e regularização de tomadas" loading="lazy"><span class="work-label">Antes e depois <span>Troca e regularização de tomadas</span></span></button>'''
              if anchor not in s:
                  raise SystemExit('Âncora da galeria não encontrada')
              s = s.replace(anchor, cards + anchor, 1)

          # Melhorias gerais de responsividade, com foco em celular
          mobile_marker = '/* MOBILE_AUDIT_2026 */'
          if mobile_marker not in s:
              css = '''
/* MOBILE_AUDIT_2026 */
.gallery{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.work{height:auto;aspect-ratio:1/1;min-width:0}
.work.work-tall{aspect-ratio:2/3}
.work img{height:100%;object-fit:contain}

@media(max-width:980px){
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .work{aspect-ratio:1/1}
  .work.work-tall{aspect-ratio:2/3}
  .reviews-actions{justify-content:flex-start}
}

@media(max-width:640px){
  :root{--wrap:min(100% - 24px,1180px)}
  body{font-size:15px}
  h1{font-size:clamp(2.3rem,11.5vw,3.4rem);line-height:1.02}
  h2{font-size:clamp(1.9rem,9vw,2.75rem)}
  .hero{min-height:auto}
  .hero-inner{padding:118px 0 76px}
  header#siteHeader{width:calc(100% - 24px);top:10px;padding:10px 12px}
  header#siteHeader .brand img,header#siteHeader.scrolled .brand img{width:118px;max-height:48px}
  .mobile{width:44px;height:44px;min-width:44px}
  .mobile-menu{position:fixed;top:72px;right:12px;width:calc(100vw - 24px);max-height:calc(100dvh - 88px);overflow:auto}
  .mobile-menu a{min-height:48px}
  .hero-copy{font-size:1rem}
  .trust{font-size:.8rem;gap:8px 14px}
  .about,.services,.portfolio,.reviews,.region{padding:72px 0}
  .diffs{padding:72px 0}
  .about-grid,.region-grid{gap:34px}
  .about-photo{min-height:350px}
  .badge{left:14px;right:14px;bottom:14px;padding:14px 16px}
  .stats{grid-template-columns:1fr;gap:10px}
  .diff-grid{grid-template-columns:1fr}
  .diff{min-height:0}
  .diff b{margin-bottom:26px}
  .cards{grid-template-columns:1fr}
  .card-img{height:230px}
  .card-body{padding:21px}
  .other{align-items:flex-start;padding:18px}
  .section-head{margin-bottom:32px}
  .gallery{grid-template-columns:1fr;gap:14px}
  .work,.work.work-tall{height:auto;aspect-ratio:auto}
  .work img{width:100%;height:auto;max-height:none;object-fit:contain}
  .work:after{background:linear-gradient(180deg,transparent 60%,rgba(4,12,22,.94))}
  .work-label{left:16px;right:16px;bottom:14px;font-size:.94rem}
  .work-label span{font-size:.75rem}
  .reviews-top{grid-template-columns:1fr;gap:22px}
  .google-score strong{font-size:2.7rem}
  .reviews-actions{display:grid;grid-template-columns:1fr;width:100%}
  .google-btn{width:100%}
  .reviews-grid{grid-template-columns:1fr}
  .region-grid{grid-template-columns:1fr}
  .region .btn{width:100%}
  .cta{padding:64px 0}
  .cta-inner{flex-direction:column;align-items:stretch}
  .cta .btn{width:100%}
  .footer-grid{grid-template-columns:1fr;gap:30px;padding-bottom:34px}
  .footer-bottom{flex-direction:column;gap:7px}
  .wa{right:14px;bottom:14px;width:56px;height:56px}
  .top{right:19px;bottom:80px}
  .lightbox{padding:14px}
  .lightbox-card{width:100%}
  .lightbox img{max-height:78dvh}
  .close{top:8px;right:8px;z-index:3}
  section[id]{scroll-margin-top:88px}
}

@media(max-width:380px){
  :root{--wrap:min(100% - 18px,1180px)}
  header#siteHeader{width:calc(100% - 16px);top:8px}
  header#siteHeader .brand img,header#siteHeader.scrolled .brand img{width:106px}
  h1{font-size:2.2rem}
  .hero-inner{padding-top:108px}
}
'''
              s = s.replace('</style>', css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validar referências
        shell: bash
        run: |
          grep -q 'assets/trabalho-tomada-mesa.jpg' index.html
          grep -q 'assets/trabalho-tomadas-sala.jpg' index.html
          grep -q 'assets/trabalho-refletor.jpg' index.html
          grep -q 'assets/trabalho-nossos-trabalhos.jpg' index.html
          grep -q 'assets/trabalho-antes-depois-tomadas.jpg' index.html
          grep -q 'MOBILE_AUDIT_2026' index.html
          test -f assets/trabalho-tomada-mesa.jpg
          test -f assets/trabalho-tomadas-sala.jpg
          test -f assets/trabalho-refletor.jpg
          test -f assets/trabalho-nossos-trabalhos.jpg
          test -f assets/trabalho-antes-depois-tomadas.jpg

      - name: Remover rotina temporária
        shell: bash
        run: rm -f .github/workflows/portfolio-mobile.yml

      - name: Publicar alteração
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/portfolio-mobile.yml
          if git diff --cached --quiet; then
            echo "Nada para atualizar."
            exit 0
          fi
          git commit -m "Amplia portfólio e melhora experiência mobile [skip ci]"
          git push
