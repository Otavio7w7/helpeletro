name: Portfolio mobile

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply changes
        run: python .github/scripts/portfolio_mobile.py

      - name: Validate
        run: |
          grep -q 'assets/trabalho-tomada-mesa.jpg' index.html
          grep -q 'assets/trabalho-tomadas-sala.jpg' index.html
          grep -q 'assets/trabalho-refletor.jpg' index.html
          grep -q 'assets/trabalho-nossos-trabalhos.jpg' index.html
          grep -q 'assets/trabalho-antes-depois-tomadas.jpg' index.html
          grep -q 'MOBILE_AUDIT_2026' index.html

      - name: Cleanup helper files
        run: rm -f .github/workflows/portfolio-mobile.yml .github/scripts/portfolio_mobile.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Amplia portfolio e melhora experiencia mobile [skip ci]"
          git push
